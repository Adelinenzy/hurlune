<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hurlune — Loups-Garous entre amis · Оборотни</title>
<meta name="description" content="Jeu de Loups-Garous en ligne entre amis, sans compte, chat traduisible français / russe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b1c2a; --bg2:#222336; --panel:#262839; --panel2:#2e3046; --line:#3a3c56; --ink:#ececf4; --mute:#9b9db8;
  --pur:#6c5ce7; --pur2:#7d6cf2; --red:#e0525a; --gold:#f5c542; --love:#b57cf0; --green:#5bd08a;
  --sky1:#141528; --sky2:#232543; --sky3:#3a3f63; --glow:#cfd3ff; --mount3:#2b3550; --mount2:#1c2638; --snow:.12; --hill:#16302e; --lake1:#2a3e55; --lake2:#1b2a3a; --shine:#9fd6e6; --tree1:#0f201f; --tree2:#173030; --trunk:#2a1f1a; --ground:#122422; --ground2:#0d1b1a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Montserrat,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
input{font:inherit;color:var(--ink);background:#15161f;border:1px solid #33354d;border-radius:10px;padding:10px 12px;min-width:0;outline:none}
input:focus{border-color:var(--pur2)}
h1,h2,h3,h4{margin:0;font-weight:800}
.muted{color:var(--mute)} .sm{font-size:12px}
.row{display:flex;gap:8px;align-items:center} .row.c{justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn-primary{background:linear-gradient(180deg,var(--pur2),var(--pur));color:#fff;font-weight:700;border-radius:10px;padding:10px 18px;box-shadow:0 4px 14px rgba(108,92,231,.35)}
.btn-primary:hover:not(:disabled){filter:brightness(1.1)}
.btn-primary.big{width:100%;padding:14px;font-size:16px;margin-top:14px}
.btn-primary.sm,.btn-ghost.sm{padding:7px 12px;font-size:13px}
.btn-ghost{background:#2c2e44;border:1px solid #3c3e5a;border-radius:10px;padding:10px 14px;font-weight:600}
.btn-ghost:hover:not(:disabled){border-color:var(--pur2)}
.btn-ghost.on{background:var(--pur);border-color:var(--pur);color:#fff}
.iconbtn{width:36px;height:36px;border-radius:50%;background:rgba(20,20,32,.75);display:grid;place-items:center;font-size:17px}
.iconbtn:hover{background:var(--pur)}
.seg{display:inline-flex;background:#16171f;border:1px solid #33354d;border-radius:10px;overflow:hidden}
.seg button{padding:8px 14px;font-weight:600;color:var(--mute)} .seg button.on{background:var(--pur);color:#fff}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--pur)}
/* ---------- scene ---------- */
.scene,.hub-scene{position:absolute;inset:0;overflow:hidden}
.scene-svg{width:100%;height:100%;display:block}
.scene .sun,.hub-scene .sun{opacity:0;transition:opacity 1.2s}
.scene .moon,.scene .stars{transition:opacity 1.2s}
.scene.day{--sky1:#6fb2e8;--sky2:#a9d4f0;--sky3:#f3d9b0;--glow:#fff2c6;--mount3:#6f88a8;--mount2:#4f6a7f;--snow:.6;--hill:#4f8a5a;--lake1:#7fc2df;--lake2:#4f97b8;--shine:#fff;--tree1:#2f5d3a;--tree2:#3f7248;--trunk:#5a3d2a;--ground:#4f7d43;--ground2:#3f6a37}
.scene.day .sun{opacity:1} .scene.day .moon,.scene.day .stars{opacity:0}
.scene *{transition:fill 1.2s, stop-color 1.2s}
/* ---------- hub ---------- */
.hub{position:relative;height:100%;overflow-y:auto;overflow-x:hidden}
.hub-scene{position:fixed;height:100vh}
.topnav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 28px;background:linear-gradient(180deg,rgba(18,18,30,.9),rgba(18,18,30,0))}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px} .logo-svg{width:36px;height:36px}
.topnav .sp{flex:1} .navbtn{font-size:18px;padding:6px 10px;border-radius:8px} .navbtn:hover{background:rgba(255,255,255,.08)}
.langsw{display:flex;background:rgba(0,0,0,.35);border-radius:9px;overflow:hidden} .langsw button{padding:6px 11px;font-weight:700;color:var(--mute)} .langsw button.on{background:var(--pur);color:#fff}
.hub-body{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:60px;min-height:calc(100vh - 70px);padding:20px}
.island{position:relative;width:240px;height:330px;flex:none}
.island-char{position:absolute;left:30px;bottom:70px;width:180px;animation:float 4s ease-in-out infinite}
.island-rock{position:absolute;left:20px;bottom:20px;width:200px;height:70px;background:radial-gradient(ellipse at 50% 20%,#3f6a43 0 40%,transparent 41%),linear-gradient(180deg,#5a4639,#3a2c24);clip-path:polygon(0 18%,100% 18%,80% 70%,55% 100%,30% 75%);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.hub-card{width:400px;max-width:100%;background:rgba(30,31,48,.92);backdrop-filter:blur(6px);border-radius:20px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.hub-card h1{font-size:24px} .hub-card p{margin:6px 0 16px}
.hub-card label{display:block;font-size:12px;color:var(--mute);margin:10px 0 6px;font-weight:600}
.hub-card .row input{flex:1}
.av-edit{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ae{display:flex;align-items:center;gap:4px;background:#191a26;border-radius:8px;padding:4px 6px;font-size:11.5px;color:var(--mute)} .ae span{flex:1}
.ae button{width:22px;height:22px;border-radius:6px;background:#2c2e44;font-weight:700} .ae button:hover{background:var(--pur)}
.or{text-align:center;color:var(--mute);font-size:12px;margin:16px 0 10px;position:relative} .or:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #33354d} .or span{position:relative;background:#1e1f30;padding:0 10px}
.joinhint{background:rgba(108,92,231,.18);border:1px solid rgba(108,92,231,.5);border-radius:10px;padding:10px;margin-top:12px;font-size:13px}
.recent{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px} .recent .muted{width:100%}
.rec{background:#2c2e44;border-radius:8px;padding:6px 10px;font-size:12.5px} .rec:hover{background:var(--pur)} .rec span{margin-left:4px}
.roles-sec{position:relative;z-index:2;background:var(--bg);padding:50px 28px 60px} .roles-sec h2{text-align:center;font-size:28px;margin-bottom:24px}
.roles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;max-width:1200px;margin:0 auto}
.role-tile{display:flex;gap:12px;background:var(--bg2);border-radius:14px;padding:14px;border-left:4px solid var(--line)}
.role-tile .ri{font-size:30px} .role-tile p{margin:6px 0 0;color:var(--mute);font-size:12.5px} .role-tile .camp{font-size:11px;font-weight:700}
.c-wolf{border-color:var(--red)!important} .c-wolf .camp,.c-wolf.cg-h{color:var(--red)}
.c-village{border-color:#4fa3e0!important} .c-village .camp,.c-village.cg-h{color:#6fb8ef}
.c-solo{border-color:var(--gold)!important} .c-solo .camp,.c-solo.cg-h{color:var(--gold)}
/* ---------- game ---------- */
.game{display:flex;height:100vh;gap:0}
.stage{position:relative;flex:1;min-width:0;overflow:hidden}
.fog{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(10,10,20,.25));pointer-events:none}
.stage.is-night .fog{background:linear-gradient(180deg,rgba(10,10,30,.15),rgba(5,5,15,.45))}
.stage-top{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;z-index:30}
.roomname{background:rgba(20,20,32,.75);padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px}
.pillbtn{background:rgba(20,20,32,.75);padding:7px 12px;border-radius:20px;font-weight:600;font-size:13px} .pillbtn:hover{background:var(--pur)}
.netbad{background:var(--red);padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700}
.chars{position:absolute;inset:0}
.ch{position:absolute;transform:translate(-50%,-100%);width:clamp(64px,7.2vw,104px);display:flex;flex-direction:column;align-items:center;transition:opacity .3s, filter .2s}
.ch .fig{width:100%;transition:transform .15s} .ch-svg{width:100%;display:block}
.ch.clk{cursor:pointer} .ch.clk:hover .fig{transform:translateY(-4px) scale(1.04)} .ch.clk .fig{filter:drop-shadow(0 0 6px rgba(125,108,242,.8))}
.ch.sel .fig{filter:drop-shadow(0 0 10px #f5c542) drop-shadow(0 0 3px #f5c542)}
.ch.inact{opacity:.45}
.ch.dead .fig{opacity:.9}
.tag{display:flex;align-items:center;gap:3px;background:rgba(14,14,22,.85);border-radius:8px;padding:2px 7px;font-size:11.5px;font-weight:700;white-space:nowrap;margin-bottom:2px;max-width:150px}
.tag .nm{overflow:hidden;text-overflow:ellipsis;cursor:pointer} .ch.me .tag{background:rgba(108,92,231,.9)} .ch.dead .tag .nm{text-decoration:line-through;opacity:.7}
.bd{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:9.5px;flex:none}
.bd.wolf{background:var(--red)} .bd.mayor{background:var(--gold);color:#3a2a00;font-size:11px} .bd.love{background:var(--love);font-size:10px} .bd.conta{background:var(--green);color:#063}.bd.fire{background:#ff8a3d}
.rtag{font-size:10.5px;background:rgba(14,14,22,.7);border-radius:6px;padding:1px 6px;margin-bottom:2px;white-space:nowrap;color:#dcd6ff}
.cand{font-size:10.5px;background:var(--gold);color:#3a2a00;border-radius:6px;padding:1px 6px;font-weight:700;margin-bottom:2px}
.votes{position:absolute;bottom:-6px;display:flex;align-items:center;gap:2px;background:var(--pur);border-radius:12px;padding:2px 6px 2px 4px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.votes b{font-size:12px;margin-right:3px} .votes i{width:16px;height:16px;border-radius:50%;overflow:hidden;background:#1b1c2a;display:block} .votes .hd-svg{width:16px;height:16px;display:block}
.votes.wolfv{background:var(--red);bottom:-28px}
.center{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:40;width:min(520px,92%)}
.card-c{background:rgba(30,31,48,.95);border-radius:18px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.5);text-align:center;backdrop-filter:blur(4px)}
.card-c.slim{padding:12px 16px;font-weight:600} .card-c.done{color:var(--green)}
.card-c h3{font-size:19px;margin:4px 0} .card-c p{margin:6px 0 4px;color:#d8d8e6}
.act-ic{font-size:36px}
.lb-top{display:flex;gap:12px;align-items:center;text-align:left} .lb-top .logo-svg{width:48px;height:48px;flex:none}
.invite{display:flex;gap:8px;margin:14px 0 10px} .invite input{flex:1;font-size:12px}
.compline{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.cpill{font-size:11.5px;background:#1a1b28;border-left:3px solid;border-radius:6px;padding:3px 7px}
.launch{margin-top:12px;font-weight:700;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;max-height:240px;overflow-y:auto}
.chip{display:flex;align-items:center;gap:6px;background:#1a1b28;border:1px solid #34364f;border-radius:20px;padding:3px 10px 3px 3px;font-size:13px;font-weight:600}
.chip .hd-svg{width:26px;height:26px;border-radius:50%;background:#2c2e44} .chip:hover{border-color:var(--pur2)} .chip.on{background:var(--pur);border-color:var(--pur)} .chip em{font-style:normal;font-size:11px;color:#ffb3b3}
.potions{display:flex;gap:10px;justify-content:center;margin-top:8px} .pot{background:#1a1b28;border-radius:8px;padding:5px 10px;font-size:12.5px}
.mbar{height:4px;background:#34364f;border-radius:4px;margin-top:14px;overflow:hidden} .mbar i{display:block;height:100%;width:100%;background:var(--pur2);transition:width .5s linear}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid #3a3c56;border-top-color:var(--pur2);margin:6px auto;animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
/* ---------- side / chat ---------- */
.side{width:400px;flex:none;display:flex;flex-direction:column;padding:14px 14px 14px 0;gap:10px;background:transparent;position:relative;z-index:20}
.game{background:var(--bg)}
.side-head{display:flex;gap:8px;align-items:center}
.phase{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:30px;padding:6px 14px 6px 6px;min-width:0}
.clock{width:32px;height:32px;border-radius:50%;background:#15161f;display:grid;place-items:center;font-size:16px;flex:none}
.ph-label{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase>div:nth-child(2){flex:1;min-width:0}
.ph-time{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px} .ph-time.hurry{color:var(--red)}
.btn-rules{background:var(--pur);border-radius:20px;padding:9px 11px;font-weight:700;font-size:12px;white-space:nowrap}
.panel{flex:1;min-height:0;background:var(--panel);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.chatlog{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.rules{flex:1;overflow-y:auto;padding:16px}
.sysm{align-self:center;text-align:center;font-size:12.5px;background:#1d1e2d;border-radius:14px;padding:6px 12px;margin:5px 0;max-width:95%;color:#d9d9e6}
.sysm b.mn{color:#fff;cursor:pointer}
.sm-small{background:none;color:var(--mute);font-size:11.5px;padding:1px 6px;margin:0;align-self:flex-start;text-align:left}
.sm-death{background:rgba(224,82,90,.16);color:#ff8f95;font-weight:600}
.sm-night{background:#151629;color:#c7c9ff;font-weight:700}
.sm-day{background:rgba(245,197,66,.13);color:#ffe08a;font-weight:700}
.sm-step{background:none;color:#a8a9d6;font-style:italic;font-size:12px;margin:1px 0}
.sm-big,.sm-win{font-weight:700;background:rgba(108,92,231,.25)}
.sm-win{font-size:15px;padding:10px 16px}
.sm-mayor{background:rgba(245,197,66,.15);color:#ffe08a}
.sm-wolfsys{background:rgba(224,82,90,.14);color:#ffadb1}
.privm{border:1px dashed rgba(181,124,240,.5);background:rgba(181,124,240,.1);color:#e7d9ff}
.sm-warn{border-color:rgba(245,197,66,.6);color:#ffe08a}
.msg{display:flex;gap:8px;padding:2px 4px;border-radius:10px}
.msg.cont{padding-top:0} .msg.cont .mbody{margin-left:36px}
.mav{width:28px;height:28px;border-radius:50%;background:#1a1b28;flex:none;overflow:hidden;display:grid;place-items:center;margin-top:3px}
.mav .hd-svg{width:28px;height:28px}
.mbody{min-width:0;flex:1}
.mname{font-size:12px;margin-top:4px} .mname b{color:#bfb5ff;cursor:pointer}
.mtext{overflow-wrap:anywhere;color:#ececf4} .mtext b.mn{color:#c6bdff;cursor:pointer}
.msg.mention{background:rgba(245,197,66,.1)}
.msg.ch-w{background:rgba(224,82,90,.18)} .msg.ch-w .mname b{color:#ff9ba0}
.msg.ch-d{opacity:.6} .msg.ch-l{background:rgba(181,124,240,.16)} .msg.ch-l .mname b{color:#dcb8ff}
.chtag{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:700} .chtag.w{background:var(--red)} .chtag.d{background:#555} .chtag.l{background:var(--love)}
.acc{font-size:12px;color:#ffd27a;font-weight:600} .acc.pres{color:var(--gold)}
.msg.mc-accuse,.msg.mc-pres{background:rgba(245,197,66,.07);margin:3px 0;padding:6px 4px}
.trx{color:#ececf4} .ogx{display:none} .og-open .ogx{display:block;color:var(--mute);font-size:12px;font-style:italic}
.showog{font-size:10.5px;color:var(--mute);text-decoration:underline;padding:0}
.og-open .showog{display:none}
.trwait{font-size:11px;color:var(--mute)}
.composer{display:flex;gap:6px;background:var(--panel);border-radius:16px;padding:6px}
.composer input{flex:1;background:transparent;border:0;padding:9px 6px}
.composer.ch-w{box-shadow:0 0 0 2px var(--red) inset} .composer.ch-d{opacity:.85;box-shadow:0 0 0 2px #555 inset} .composer.ch-l{box-shadow:0 0 0 2px var(--love) inset}
.cbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:16px;background:#1d1e2d;flex:none} .cbtn:hover:not(:disabled){background:#34364f}
.cbtn.on{background:var(--pur)} .cbtn.send{background:var(--pur)}
/* rules panel */
.myrole{display:flex;gap:12px;background:var(--panel2);border-radius:14px;padding:14px;border-left:4px solid}
.myrole .ri{font-size:40px} .myrole h3{font-size:20px} .myrole p{margin:4px 0;color:#d6d6e4;font-size:13px}
.goal{font-size:12.5px;color:var(--gold);font-weight:600}
.infos{margin-top:10px;display:flex;flex-direction:column;gap:5px;font-size:13px} .infos div{background:#1d1e2d;border-radius:8px;padding:6px 10px}
.rules h4{margin:18px 0 8px;font-size:14px}
.remgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rem{display:flex;gap:6px;align-items:center;background:#1d1e2d;border-radius:8px;padding:5px 8px;font-size:12px;border-left:3px solid} .rem b{flex:1;font-weight:600} .rem em{font-style:normal;color:var(--mute)}
.journal{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
/* end */
.endov{position:fixed;inset:0;background:rgba(8,8,16,.72);z-index:60;display:grid;place-items:center;padding:20px}
.endcard{width:min(620px,100%);background:var(--bg2);border-radius:22px;padding:26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);max-height:92vh;overflow:auto}
.endico{font-size:54px} .endcard h2{font-size:28px;margin:6px 0 14px}
.w-wolf h2{color:#ff8f95} .w-village h2{color:#8fd0ff} .w-lovers h2{color:#dcb8ff} .w-white h2,.w-rat h2,.w-merc h2{color:var(--gold)}
.winners{display:flex;justify-content:center;flex-wrap:wrap;gap:8px} .wch{width:74px;font-size:12px} .wch .ch-svg{width:74px}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:5px;margin:16px 0 6px;text-align:left;font-size:12.5px}
.reveal div{background:#1b1c2a;border-radius:8px;padding:5px 9px} .reveal div.w{outline:1px solid var(--gold)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,8,16,.65);z-index:80;display:grid;place-items:center;padding:16px}
.mcard{width:min(460px,100%);background:var(--bg2);border-radius:20px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);max-height:94vh;overflow-y:auto}
.mcard.wide{width:min(920px,100%)}
.mcard h2{font-size:20px;margin-bottom:12px} .mcard p{margin:4px 0 10px}
.mcard form input{width:100%}
.frm{margin-bottom:12px} .frm label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;font-weight:600} .frm input{width:100%}
.frm.row2{display:flex;gap:18px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:10px} .stepper button{width:32px;height:32px;border-radius:9px;background:#2c2e44;font-weight:800;font-size:16px} .stepper b{font-size:18px;min-width:24px;text-align:center}
.comp-h{display:flex;align-items:center;gap:12px;margin:8px 0} .comp-h .ok{color:var(--green);font-weight:700} .comp-h .bad{color:var(--red);font-weight:700} .comp-h button{margin-left:auto}
.comp{display:flex;flex-direction:column;gap:10px}
.cg-h{font-weight:800;font-size:12.5px;margin-bottom:5px}
.cg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:5px}
.ct{display:flex;align-items:center;gap:6px;background:#1b1c2a;border-radius:9px;padding:5px 7px;border:1px solid transparent} .ct.on{border-color:var(--pur2);background:#24234a}

function suggestComp(n){
  const c = {};
  const add=(r,k=1)=>c[r]=(c[r]||0)+k;
  const wolves = n<=6?1:n<=9?2:n<=12?3:4;
  add("werewolf", wolves);
  add("seer");
  if(n>=5) add("witch");
  if(n>=6) add("hunter");
  if(n>=7) add("cupid");
  if(n>=8) add("guard");
  if(n>=9) add("littleGirl");
  if(n>=10){ c.werewolf--; add("blackWolf"); }
  if(n>=11) add("whiteWolf");
  if(n>=12) add("mentalist");
  if(n>=13) add("redRidingHood");
  if(n>=14) add("gravedigger");
  if(n>=15) add("dictator");
  if(n>=16) add("talkativeWolf"), c.werewolf--;
  const tot = Object.values(c).reduce((a,b)=>a+b,0);
  if(tot<n) add("villager", n-tot);
  return c;
}

function rid(n=8){ const a="abcdefghijkmnpqrstuvwxyz23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(n)); for(const x of r) s+=a[x%a.length]; return s; }
function b64(buf){ const u=new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
function ub64(s){ const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
const b64u = buf => b64(buf).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const ub64u = s => ub64(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length+3)%4));
const enc = new TextEncoder(), dec = new TextDecoder();

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pick = a => a[Math.floor(Math.random()*a.length)];

const Crypto = {
  async genECDH(){
    const kp = await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveKey"]);
    return {pub: await crypto.subtle.exportKey("jwk",kp.publicKey), priv: await crypto.subtle.exportKey("jwk",kp.privateKey)};
  },
  _priv:new Map(), _pair:new Map(), _room:new Map(),
  async privKey(jwk){ const k=JSON.stringify(jwk); if(!this._priv.has(k)) this._priv.set(k, crypto.subtle.importKey("jwk",jwk,{name:"ECDH",namedCurve:"P-256"},false,["deriveKey"])); return this._priv.get(k); },
  async pairKey(myPrivJwk, otherPubJwk){
    const id = JSON.stringify(myPrivJwk.d)+"|"+otherPubJwk.x+otherPubJwk.y;
    if(!this._pair.has(id)) this._pair.set(id,(async()=>{
      const pub = await crypto.subtle.importKey("jwk",otherPubJwk,{name:"ECDH",namedCurve:"P-256"},false,[]);
      return crypto.subtle.deriveKey({name:"ECDH",public:pub}, await this.privKey(myPrivJwk), {name:"AES-GCM",length:256}, false, ["encrypt","decrypt"]);
    })());
    return this._pair.get(id);
  },
  async roomKey(raw){ if(!this._room.has(raw)) this._room.set(raw, crypto.subtle.importKey("raw",ub64u(raw),"AES-GCM",false,["encrypt","decrypt"])); return this._room.get(raw); },
  async seal(key,obj){ const iv=crypto.getRandomValues(new Uint8Array(12)); const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj))); return {iv:b64(iv),c:b64(c)}; },
  async open(key,box){ const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(box.iv)},key,ub64(box.c)); return JSON.parse(dec.decode(p)); }
};

/* ---- Transports: MQTT relay (default) or local BroadcastChannel (tests) ---- */
const BROKERS = ["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081/mqtt"];
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

class LocalTransport {
  constructor(){ this.subs=new Set(); this.h=null; this.status="online"; }
  async connect(){
    this.bc = new BroadcastChannel("hl-bus");
    this.bc.onmessage = e => this._deliver(e.data.topic, e.data.payload);
    return 0;
  }
  _match(t){ return this.subs.has(t); }
  _deliver(topic,payload){ if(this._match(topic) && this.h) this.h(topic,payload); }
  sub(topic){ this.subs.add(topic); try{ const r=localStorage.getItem("hlret:"+topic); if(r) setTimeout(()=>this._deliver(topic,r),5); }catch(e){} }
  pub(topic,payload,retain){ if(retain){ try{ localStorage.setItem("hlret:"+topic,payload);}catch(e){} } this.bc.postMessage({topic,payload}); setTimeout(()=>this._deliver(topic,payload),0); }
  onMessage(h){ this.h=h; }
  onStatus(){}
}
class MqttTransport {
  constructor(){ this.h=null; this.subs=new Set(); this.statusH=()=>{}; }
  async connect(pref){
    if(typeof mqtt==="undefined"){
      try{ await loadScript("https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"); }
      catch(e){ await loadScript("https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"); }
    }
    const order = pref!=null ? [pref, ...BROKERS.map((_,i)=>i).filter(i=>i!==pref)] : BROKERS.map((_,i)=>i);
    for(const i of order){
      const ok = await new Promise(res=>{
        const c = mqtt.connect(BROKERS[i],{clientId:"hl_"+rid(12),clean:true,keepalive:30,reconnectPeriod:2500,connectTimeout:7000});
        const to=setTimeout(()=>{ c.end(true); res(null); },8000);
        c.once("connect",()=>{ clearTimeout(to); res(c); });
        c.once("error",()=>{});
      });
      if(ok){
        this.c=ok; this.idx=i;
        ok.on("message",(t,m)=>{ if(this.h) this.h(t,m.toString()); });
        ok.on("connect",()=>{ this.statusH("online"); for(const s of this.subs) ok.subscribe(s,{qos:0}); });
        ok.on("offline",()=>this.statusH("offline"));
        ok.on("reconnect",()=>this.statusH("reconnecting"));
        return i;
      }
      if(pref!=null) break; // everyone must use the same broker
    }
    throw new Error("relay");
  }
  sub(t){ this.subs.add(t); this.c.subscribe(t,{qos:0}); }
  pub(t,p,retain){ this.c.publish(t,p,{qos:0,retain:!!retain}); }
  onMessage(h){ this.h=h; }
  onStatus(h){ this.statusH=h; }
}

/* ---- Room connection: encrypted pub/sub ---- */
class Room {
  // opts: {room, key(b64u), broker, me:{pid, keys}, isHost, hostKeys}
  constructor(o){ Object.assign(this,o); this.base="hurlune1/"+o.room; this.handlers={}; }
  on(ev,fn){ this.handlers[ev]=fn; }
  emit(ev,...a){ if(this.handlers[ev]) this.handlers[ev](...a); }
  async connect(){
    this.T = USE_LOCAL ? new LocalTransport() : new MqttTransport();
    this.T.onStatus(s=>this.emit("status",s));
    this.broker = await this.T.connect(this.broker);
    this.rk = await Crypto.roomKey(this.key);
    this.T.onMessage((t,p)=>this._in(t,p).catch(e=>console.warn("msg",e)));
    if(this.isHost){ this.T.sub(this.base+"/h"); }
    else { this.T.sub(this.base+"/s"); this.T.sub(this.base+"/b"); this.T.sub(this.base+"/p/"+this.me.pid); }
    return this.broker;
  }
  async _in(topic,payload){
    const box = JSON.parse(payload);
    if(topic===this.base+"/s"){ const st=await Crypto.open(this.rk,box); this.hostPub=st.hostPub; this.emit("state",st); }
    else if(topic===this.base+"/b"){ this.emit("bcast", await Crypto.open(this.rk,box)); }
    else if(topic===this.base+"/p/"+this.me.pid){ if(!this.hostPub) return; const k=await Crypto.pairKey(this.me.keys.priv,this.hostPub); this.emit("priv", await Crypto.open(k,box)); }
    else if(topic===this.base+"/h" && this.isHost){
      const outer = await Crypto.open(this.rk, box);       // {from, pub, box}
      const k = await Crypto.pairKey(this.hostKeys.priv, outer.pub);
      const msg = await Crypto.open(k, outer.box);
      this.emit("toHost", outer.from, outer.pub, msg);
    }
  }
  // player -> host
  async send(msg){
    const k = await Crypto.pairKey(this.me.keys.priv, this.hostPub);
    const inner = await Crypto.seal(k,msg);
    const outer = await Crypto.seal(this.rk,{from:this.me.pid,pub:this.me.keys.pub,box:inner});
    this.T.pub(this.base+"/h", JSON.stringify(outer));
  }
  // host -> all
  async publishState(st){ this.T.pub(this.base+"/s", JSON.stringify(await Crypto.seal(this.rk,st)), true); }
  async broadcast(m){ this.T.pub(this.base+"/b", JSON.stringify(await Crypto.seal(this.rk,m))); }
  async sendTo(pid,pub,m){ const k=await Crypto.pairKey(this.hostKeys.priv,pub); this.T.pub(this.base+"/p/"+pid, JSON.stringify(await Crypto.seal(k,m))); }
}

class Host {
  constructor(cfg){
    Object.assign(this,{players:{},order:[],msgs:[],status:"lobby",ph:{k:"lobby",seq:0},acts:{},sec:null,mseq:0,lastViews:{},cands:[],votes:{},mayor:null,winner:null,winners:[],round:1},cfg);
    this.room=null; this.localSink=null; this._dirty=true; this._lastStateJson=""; this._lastPub=0;
  }
  serial(){ const o={}; for(const k of ["roomId","key","broker","hostKeys","hostId","settings","players","order","msgs","status","ph","acts","sec","mseq","cands","votes","mayor","winner","winners","round"]) o[k]=this[k]; return o; }
  save(){ if(this._saveT) return; this._saveT=setTimeout(()=>{ this._saveT=null; lsSet("host."+this.roomId,this.serial()); },800); }
  attach(room){
    this.room=room;
    room.on("toHost",(from,pub,msg)=>this.onMsg(from,pub,msg));
    if(this._tick) clearInterval(this._tick);
    this._tick=setInterval(()=>this.tick(),400);
    this.flush(true);
  }
  get S(){ return this.settings; }
  dur(k){ const sp=(window.TEST_SPEED)||SPEEDS[this.S.speed]||SPEEDS.normal; return (sp[k]||20)*1000; }
  // ---------- helpers ----------
  P(pid){ return this.players[pid]; }
  R(pid){ return this.sec&&this.sec.R[pid]; }
  alive(pid){ const r=this.R(pid); return !!(r&&r.alive); }
  aliveIds(){ return this.order.filter(p=>this.alive(p)); }
  role(pid){ return this.R(pid)&&this.R(pid).role; }
  camp(pid){ return this.R(pid)&&this.R(pid).camp; }
  aliveWith(roles){ roles=[].concat(roles); return this.aliveIds().filter(p=>roles.includes(this.role(p))); }
  wolfVoters(){ return this.aliveIds().filter(p=>this.camp(p)==="wolf"||this.role(p)==="whiteWolf"); }
  wolfSees(pid){ return this.camp(pid)==="wolf"||this.role(pid)==="whiteWolf"; }
  name(pid){ return (this.P(pid)&&this.P(pid).name)||"?"; }
  isNight(){ return this.ph.k.startsWith("n_"); }
  visible(pid,aud){
    if(this.status==="ended") return true;
    if(aud==="all") return true;
    if(aud==="wolf") return this.wolfSees(pid);
    if(aud==="dead") return (this.sec&&!this.alive(pid)&&this.R(pid)) || this.role(pid)==="necromancer";
    if(aud&&aud.ids) return aud.ids.includes(pid);
    return false;
  }
  // ---------- messaging ----------
  msg(m,aud="all"){
    m.id="m"+(++this.mseq); m.t=Date.now();
    this.msgs.push({m,aud}); if(this.msgs.length>900) this.msgs.splice(0,this.msgs.length-900);
    this.deliver({t:"m",m},aud);
    if(m.x&&this.translator){
      const langs=[...new Set(Object.values(this.players).map(p=>["fr","ru","en"].includes(p.lang)?p.lang:"en"))];
      this.translator(m.x,langs).then(tr=>{ if(!tr) return; m.tr=tr; this.deliver({t:"tr",id:m.id,tr},aud); this.save(); }).catch(e=>console.warn("tr",e));
    }
    this.save();
  }
  deliver(o,aud){
    if(aud==="all"){ if(this.room) this.room.broadcast(o); if(this.localSink) this.localSink.priv(o); }
    else for(const pid of this.order) if(this.visible(pid,aud)) this.sendPriv(pid,o);
  }
  sys(k,p,cls,aud){ this.msg({ch:aud&&aud!=="all"?"ps":"s",k,p:p||{},cls:cls||"info"},aud||"all"); }
  priv(pid,k,p,cls){ this.msg({ch:"ps",k,p:p||{},cls:cls||"priv"},{ids:[pid]}); }
  sendPriv(pid,obj){
    if(pid===this.hostId){ if(this.localSink) this.localSink.priv(obj); return; }
    const P=this.P(pid); if(P&&P.pub&&this.room) this.room.sendTo(pid,P.pub,obj).catch(e=>console.warn(e));
  }
  resync(pid){ const msgs=this.msgs.filter(x=>this.visible(pid,x.aud)).slice(-400).map(x=>x.m); this.lastViews[pid]=null; this.sendPriv(pid,{t:"sync",msgs,v:this.view(pid)}); }
  // ---------- public state ----------
  buildState(){
    const now=Date.now();
    return {
      hostPub:this.hostKeys.pub, room:this.roomId, hostId:this.hostId, status:this.status, round:this.round,
      name:this.S.name, seats:this.S.seats, comp:this.S.comp, mode:this.S.mode, speed:this.S.speed,
      players:this.order.map(pid=>{ const P=this.P(pid),R=this.R(pid); return {
        id:pid, n:P.name, av:P.av, lang:P.lang,
        alive: R?R.alive:true, role: R&&(R.revealed||this.status==="ended")?R.role:null,
        inf: R&&this.status==="ended"?!!R.infected:undefined,
        inact: pid!==this.hostId && now-(P.seen||0)>25000 };}),
      ph:{k:this.ph.k,n:this.ph.n,end:this.ph.end,seq:this.ph.seq,kind:this.ph.data&&this.ph.data.kind,who:this.ph.k==="prompt"||this.ph.k==="d_dict"?this.ph.data&&this.ph.data.who:undefined},
      votes:this.votes, cands:this.cands, mayor:this.mayor, day:this.sec?this.sec.day:0, night:this.sec?this.sec.night:0,
      winner:this.winner, winners:this.winners, lovers:this.status==="ended"&&this.sec?this.sec.lovers:null,
      dict:this.sec&&this.sec.dictPublic||null, oa:!!this.translator, now
    };
  }
  flush(force){
    const st=this.buildState(); const j=JSON.stringify({...st,now:0});
    const now=Date.now();
    if(force||j!==this._lastStateJson||now-this._lastPub>20000){
      this._lastStateJson=j; this._lastPub=now;
      if(this.room) this.room.publishState(st).catch(e=>console.warn(e));
      if(this.localSink) this.localSink.state(st);
    }
    for(const pid of this.order){
      const v=this.view(pid); const vj=JSON.stringify(v);
      if(vj!==this.lastViews[pid]){ this.lastViews[pid]=vj; this.sendPriv(pid,{t:"v",v}); }
    }
    this.save();
  }
  // ---------- private view ----------
  view(pid){
    const R=this.R(pid); const v={me:pid,host:pid===this.hostId};
    if(!R) return v;
    const sec=this.sec, k=this.ph.k;
    Object.assign(v,{role:R.role,orig:R.orig,camp:R.camp,infected:!!R.infected,alive:R.alive});
    if(this.wolfSees(pid)) v.wolves=this.order.filter(p=>this.wolfSees(p));
    if(R.lover){ v.lover=R.lover; v.loverRole=this.role(R.lover); }
    if(R.role==="cupid"&&sec.lovers) v.couple=sec.lovers;
    if(R.role==="sickRat"||sec.contaminated.includes(pid)) v.conta=sec.contaminated.slice();
    if(R.seen&&R.seen.length) v.seen=R.seen;
    if(WITCH_ROLES.includes(R.role)) v.pot={heal:R.heal,poison:R.poison};
    if(R.role==="guard") v.guardLast=R.guardLast||null;
    if(R.role==="pyromancer") v.barrels=sec.barrels.slice();
    if(R.role==="heir"&&R.testator) v.testator=R.testator;
    if(R.role==="mercenary"&&R.mercTarget&&sec.day>=1&&R.camp==="solo") v.merc=R.mercTarget;
    if(R.word) v.word=R.word, v.saidWord=!!R.saidWord;
    if(R.letter) v.letter=R.letter, v.usedLetter=!!R.usedLetter;
    if(this.status!=="running"){ return v; }
    // chat rights
    const night=this.isNight();
    v.chat={v:R.alive&&!night, w:R.alive&&k==="n_wolves"&&this.wolfSees(pid), d:!R.alive||(R.role==="necromancer"&&night), l:!!(R.lover&&R.alive),
            seeW:this.wolfSees(pid)||(R.role==="littleGirl"&&R.alive), seeD:!R.alive||R.role==="necromancer"};
    // prompt
    let pr=null; const a=this.acts[pid];
    if(R.alive){
      if(k==="n_cupid"&&R.role==="cupid") pr={k:"cupid",n:2,self:1};
      else if(k==="n_heir"&&R.role==="heir"&&!R.testator) pr={k:"heir",n:1};
      else if(k==="n_seer"&&SEER_ROLES.includes(R.role)) pr={k:"seer",n:1};
      else if(k==="n_guard"&&R.role==="guard") pr={k:"guard",n:1,self:1,not:R.guardLast||null};
      else if(k==="n_rat"&&R.role==="sickRat") pr={k:"rat",n:2};
      else if(k==="n_pyro"&&R.role==="pyromancer") pr={k:"pyro",n:1,barrels:sec.barrels.slice()};
      else if(k==="n_wolves"&&this.wolfSees(pid)){ pr={k:"wolves",n:1,infect:R.role==="blackWolf"&&!sec.infectUsed}; v.wolfVotes=sec.nt.wolfVotes; }
      else if(k==="n_witch"&&WITCH_ROLES.includes(R.role)) pr={k:"witch",victim:R.heal>0?this.effVictim():null,heal:R.heal,poison:R.poison};
      else if(k==="n_white"&&R.role==="whiteWolf") pr={k:"white",n:1};
      else if(k==="d_dictAsk"&&R.role==="dictator") pr={k:"dictAsk"};
      else if(k==="d_dict"&&R.role==="dictator") pr={k:"dict",n:1};
      else if(k==="d_tie"&&this.mayor===pid) pr={k:"tie",n:1,opts:this.ph.data.opts};
      else if(k==="d_cand"&&!this.cands.includes(pid)) pr={k:"cand"};
    }
    if(k==="prompt"&&this.ph.data.who===pid) pr={k:this.ph.data.kind,n:1,dead:1};
    if(pr){ pr.seq=this.ph.seq; pr.acted=!!a; v.prompt=pr; }
    return v;
  }
  effVictim(){ const nt=this.sec.nt; if(!nt||!nt.victim) return null; if(nt.infect) return null; if(this.protectedFromWolves(nt.victim)) return null; return nt.victim; }
  protectedFromWolves(v){
    const sec=this.sec, nt=sec.nt;
    if(nt&&nt.guarded===v) return true;
    const r=this.role(v);
    if(r==="redRidingHood"){ const h=this.aliveWith("hunter"); if(h.some(x=>!this.R(x).infected)) return true; }
    if(r==="pinkRidingHood"&&sec.lovers&&sec.lovers.every(x=>this.alive(x))) return true;
    if(r==="blueRidingHood"&&this.aliveWith("villager").some(x=>x!==v)) return true;
    return false;
  }
  // ---------- incoming ----------
  onMsg(from,pub,msg){
    let P=this.players[from];
    if(P&&P.pub&&(P.pub.x!==pub.x||P.pub.y!==pub.y)) return; // identity mismatch

    if(r==="hunter"||r==="gravedigger"){ this.priv(h,"inheritNothing",{t:{pid:from}},"priv"); H.testator=null; return; }
    H.role=r; H.testator=null;
    const F=this.R(from); H.heal=F.heal||0; H.poison=F.poison||0; H.dictUsed=F.dictUsed; H.guardLast=null;
    if(r==="mercenary"){ H.mercTarget=F.mercTarget; }
    H.camp=H.infected?"wolf":(r==="mercenary"&&this.sec.day>1?"village":ROLES[r].camp);
    this.priv(h,"inherited",{t:{pid:from},r:{role:r}},"role");
    if(H.camp==="wolf"&&!H.infected){ this.sys("joinedPack",{t:{pid:h}},"wolfsys","wolf"); }

  }
  runPending(){
    if(this.checkWin()) return;

    if(p.kind==="succ"&&!this.aliveIds().length){ this.runPending(); return; }
    this.setPhase("prompt","prompt",{kind:p.kind,who:p.who});
  }
  endPrompt(){
    const {kind,who}=this.ph.data; const a=this.acts[who]||{};

    else if(kind==="grave"){
      const t=a.t&&this.players[a.t]?a.t:pick(this.order.filter(x=>x!==who));
      if(t){ const wolf=this.camp(t)==="wolf"; const pool=this.order.filter(x=>x!==who&&x!==t&&((this.camp(x)==="wolf")!==wolf)); const o=pool.length?pick(pool):null;
        const pair=shuffle([t,o].filter(Boolean)); this.sys("graves",{a:{pid:pair[0]},b:pair[1]?{pid:pair[1]}:"—"},"big"); }
    } else if(kind==="succ"){
      const al=this.aliveIds(); const t=a.t&&this.alive(a.t)?a.t:pick(al); this.mayor=t||null; if(t) this.sys("newMayor",{t:{pid:t}},"mayor");
    }
    this.runPending();
  }
  continueAfter(){ const a=this.sec.after; this.sec.after=null; if(a==="day") this.startDay(); else this.startNight(); }
  startDay(){
    const sec=this.sec; sec.day++; this.votes={}; sec.mentalistDone=false;
    for(const p of this.aliveWith("talkativeWolf")){ const R=this.R(p),L=WORDS[this.P(p).lang]?this.P(p).lang:"fr"; R.word=pick(WORDS[L]); R.saidWord=false; this.priv(p,"yourWord",{w:R.word},"warn"); }
    for(const p of this.aliveWith("literateWolf")){ const R=this.R(p),L=WORDS[this.P(p).lang]?this.P(p).lang:"fr"; R.letter=pick(LETTERS[L]); R.usedLetter=false; this.priv(p,"yourLetter",{l:R.letter},"warn"); }
    if(sec.day===2&&!sec.mayorDone&&this.aliveIds().length>=3){ this.cands=[]; this.setPhase("d_cand","cand"); return; }
    this.afterElection();
  }
  afterElection(){
    const d=this.aliveWith("dictator").filter(p=>!this.R(p).dictUsed);
    if(d.length) this.setPhase("d_dictAsk","dictAsk");
    else this.setPhase("d_vote","vote");
  }
  resolveVote(){
    const c={}; for(const [v,t] of Object.entries(this.votes)) if(this.alive(v)&&this.alive(t)) c[t]=(c[t]||0)+1;
    let max=0,best=[]; for(const t in c){ if(c[t]>max){max=c[t];best=[t];} else if(c[t]===max) best.push(t); }
    if(best.length>1){
      if(this.mayor&&this.alive(this.mayor)){ this.sys("tieMayor",{t:{pid:this.mayor}},"info"); this.setPhase("d_tie","tie",{opts:best}); return; }
      this.sys("tieNobody",{},"info");

  }
  lynch(t){
    if(this.role(t)==="wolfRidingHood"&&this.aliveWith("blackWolf").length){ this.sys("cwSaved",{t:{pid:t}},"info"); return; }
    this.kill(t,"vote");
    const sec=this.sec;
    if(sec.day===1) for(const m of this.aliveWith("mercenary")) if(this.R(m).camp==="solo"&&this.R(m).mercTarget===t) sec.mercWin=m;
  }
  finishDay(){
    const sec=this.sec; this.votes={};
    for(const p of this.aliveWith("talkativeWolf")) if(this.R(p).word&&!this.R(p).saidWord) this.kill(p,"word");
    for(const p of this.aliveWith("literateWolf")) if(this.R(p).usedLetter) this.kill(p,"letter");
    for(const p of this.order){ const R=this.R(p); R.word=null; R.letter=null; }
    if(sec.mercWin){ this.endGame("merc",[sec.mercWin]); return; }
    if(sec.day===1) for(const m of this.order) if(this.role(m)==="mercenary"&&this.R(m).camp==="solo"){ this.R(m).camp="village"; if(this.alive(m)) this.priv(m,"mercFailed",{},"priv"); }
    sec.after="night"; this.runPending();
  }
  checkWin(){
    if(this.status!=="running") return true;
    const al=this.aliveIds(), sec=this.sec;
    if(!al.length){ this.endGame("draw",[]); return true; }

    if(L&&al.length===2&&L.every(x=>this.alive(x))&&this.camp(L[0])!==this.camp(L[1])){ this.endGame("lovers",L.slice()); return true; }
    if(al.length===1&&this.role(al[0])==="whiteWolf"){ this.endGame("white",al.slice()); return true; }
    const rat=this.aliveWith("sickRat")[0];
    if(rat&&al.filter(x=>x!==rat).every(x=>sec.contaminated.includes(x))&&al.length>1){ this.endGame("rat",[rat]); return true; }
    if(al.every(x=>this.camp(x)==="wolf")){ this.endGame("wolf",this.order.filter(x=>this.camp(x)==="wolf")); return true; }
    if(!al.some(x=>this.camp(x)==="wolf"||this.camp(x)==="solo")){ this.endGame("village",this.order.filter(x=>this.camp(x)==="village")); return true; }
    return false;
  }
  endGame(w,winners){
    this.status="ended"; this.winner=w; this.winners=winners; this.ph={k:"ended",seq:this.ph.seq+1,n:0}; this.acts={};

    this.sys("win_"+w,{},"win");
    for(const p of this.order) this.resync(p);
    this.flush(true);
  }
  again(){
    this.status="lobby"; this.sec=null; this.ph={k:"lobby",seq:this.ph.seq+1}; this.acts={}; this.votes={}; this.cands=[]; this.mayor=null; this.winner=null; this.winners=[]; this.round++;

    if(this.order.length>this.S.seats) this.S.seats=this.order.length;
    this.sys("newRound",{},"big");
    for(const p of this.order) this.resync(p);
    this.checkFull(); this.flush(true);
  }
}
function suggestCompFit(comp,n){
  const c=clone(comp||{}); let tot=compTotal(c);
  while(tot>n){ if(c.villager>0){c.villager--;} else { const ks=Object.keys(c).filter(k=>c[k]>0&&!(k==="werewolf"&&c[k]===1)); const k=ks.reverse().find(k=>k!=="werewolf")||ks[0]; if(!k) break; c[k]--; } tot--; }
  if(tot<n) c.villager=(c.villager||0)+(n-tot);
  for(const k in c) if(!c[k]) delete c[k];
  return c;
}

/* ===================== AUDIO (procedural, with reverb & ambiences) ===================== */
const AUD = (function(){
  let c=null, master, comp, verb, verbIn, dry, amb={}, curMood=null, hbTimer=null, evTimer=null, started=false;
  const vol=()=>{ return (APP&&APP.set&&APP.set.vol!=null)?APP.set.vol:.7; };
  const ambOn=()=>!(APP&&APP.set&&APP.set.amb===false);
  let ambBus, ambVerb;
  function ctx(){
    if(c) return c;
    try{ c=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    master=c.createGain(); master.gain.value=vol();
    comp=c.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=3;
    master.connect(comp).connect(c.destination);
    // reverb: generated impulse response
    verb=c.createConvolver(); const len=c.sampleRate*3.2, ir=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++){ const tt=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-tt,3.2)*(i<c.sampleRate*.01?i/(c.sampleRate*.01):1); } }
    verb.buffer=ir; verbIn=c.createGain(); verbIn.gain.value=.55; verbIn.connect(verb); const vOut=c.createGain(); vOut.gain.value=.5; verb.connect(vOut).connect(master);
    dry=c.createGain(); dry.connect(master);
    ambBus=c.createGain(); ambBus.gain.value=ambOn()?1:0; ambBus.connect(master); ambVerb=c.createGain(); ambVerb.gain.value=ambOn()?1:0; ambVerb.connect(verbIn);
    return c;
  }
  function out(node,wet=.35,amb=false){ const g1=c.createGain(); g1.gain.value=1-wet*.4; const g2=c.createGain(); g2.gain.value=wet; node.connect(g1).connect(amb?ambBus:dry); node.connect(g2).connect(amb?ambVerb:verbIn); }
  let AMB=false; // routes helper sounds to the ambience bus while generating ambience events
  function noiseBuf(sec=2,color="white"){ const b=c.createBuffer(1,c.sampleRate*sec,c.sampleRate), d=b.getChannelData(0); let l=0;
    for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; if(color==="brown"){ l=(l+.02*w)/1.02; d[i]=l*3.5; } else if(color==="pink"){ l=.97*l+.03*w; d[i]=(l*3+w*.15); } else d[i]=w; } return b; }
  function env(g,T,a,peak,d,sus=0){ g.gain.cancelScheduledValues(T); g.gain.setValueAtTime(.0001,T); g.gain.exponentialRampToValueAtTime(peak,T+a); g.gain.exponentialRampToValueAtTime(Math.max(sus,.0001),T+a+d); }
  // FM bell
  function bell(T,f,{dur=3,v=.25,ratio=1.4,idx=3,wet=.6}={}){
    const car=c.createOscillator(), mod=c.createOscillator(), mg=c.createGain(), g=c.createGain();
    car.frequency.value=f; mod.frequency.value=f*ratio; mg.gain.setValueAtTime(f*idx,T); mg.gain.exponentialRampToValueAtTime(f*.05,T+dur);
    mod.connect(mg).connect(car.frequency); car.connect(g); env(g,T,.005,v,dur); out(g,wet,AMB); car.start(T); mod.start(T); car.stop(T+dur+.1); mod.stop(T+dur+.1);
  }
  function pluck(T,f,{v=.2,dur=.6,type="triangle",wet=.3,cut=2500}={}){ const o=c.createOscillator(), g=c.createGain(), fl=c.createBiquadFilter(); o.type=type; o.frequency.value=f; fl.type="lowpass"; fl.frequency.setValueAtTime(cut,T); fl.frequency.exponentialRampToValueAtTime(300,T+dur); o.connect(fl).connect(g); env(g,T,.004,v,dur); out(g,wet,AMB); o.start(T); o.stop(T+dur+.05); }
  function noiseHit(T,{f=1000,q=1,v=.3,dur=.08,type="bandpass",wet=.2}={}){ const s=c.createBufferSource(); s.buffer=noiseBuf(Math.max(.2,dur+.05)); const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q; const g=c.createGain(); s.connect(fl).connect(g); env(g,T,.002,v,dur); out(g,wet,AMB); s.start(T); s.stop(T+dur+.05); }
  function howl(T,{base=330,v=.22,dur=3.2,wet=.8}={}){
    for(const [det,vv] of [[0,v],[6,v*.5],[-4,v*.35]]){
      const o=c.createOscillator(); o.type="sawtooth"; const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=5.2+Math.random(); lg.gain.value=7;
      lfo.connect(lg).connect(o.frequency);
      const f1=c.createBiquadFilter(); f1.type="bandpass"; f1.frequency.value=500; f1.Q.value=6; const f2=c.createBiquadFilter(); f2.type="bandpass"; f2.frequency.value=900; f2.Q.value=8;

      o.frequency.setValueAtTime(b*.85,T); o.frequency.exponentialRampToValueAtTime(b*1.75,T+dur*.28); o.frequency.setValueAtTime(b*1.75,T+dur*.55); o.frequency.exponentialRampToValueAtTime(b*1.25,T+dur);
      f1.frequency.setValueAtTime(400,T); f1.frequency.linearRampToValueAtTime(650,T+dur*.3);
      o.connect(f1).connect(mix); o.connect(f2).connect(mix); mix.connect(g);
      g.gain.setValueAtTime(.0001,T); g.gain.exponentialRampToValueAtTime(vv,T+dur*.22); g.gain.setValueAtTime(vv,T+dur*.6); g.gain.exponentialRampToValueAtTime(.0001,T+dur);
      out(g,wet,AMB); o.start(T); lfo.start(T); o.stop(T+dur+.1); lfo.stop(T+dur+.1);
    }
  }
  function thunder(T){
    const s=c.createBufferSource(); s.buffer=noiseBuf(4.5,"brown"); const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.setValueAtTime(1800,T); f.frequency.exponentialRampToValueAtTime(140,T+3.5);
    const g=c.createGain(); g.gain.setValueAtTime(.0001,T); g.gain.exponentialRampToValueAtTime(1.2,T+.03); g.gain.exponentialRampToValueAtTime(.5,T+.25); g.gain.linearRampToValueAtTime(.7,T+.6); g.gain.exponentialRampToValueAtTime(.0001,T+4.2);
    s.connect(f).connect(g); out(g,.5); s.start(T); s.stop(T+4.4);
    noiseHit(T,{f:3000,q:.5,v:.5,dur:.15,type:"highpass",wet:.6});
    const o=c.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(70,T); o.frequency.exponentialRampToValueAtTime(30,T+1.5); const og=c.createGain(); o.connect(og); env(og,T,.01,.6,1.6); out(og,.3); o.start(T); o.stop(T+1.7);
  }

  function chord(T,fs,{type="sawtooth",v=.08,dur=1.2,cut=1800,wet=.5,stagger=0}={}){ fs.forEach((f,i)=>{ const o=c.createOscillator(); o.type=type; o.frequency.value=f; const fl=c.createBiquadFilter(); fl.type="lowpass"; fl.frequency.setValueAtTime(cut*.4,T); fl.frequency.linearRampToValueAtTime(cut,T+.15); const g=c.createGain(); o.connect(fl).connect(g); const t0=T+i*stagger; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+.06); g.gain.setValueAtTime(v,t0+dur*.6); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); out(g,wet); o.start(t0); o.stop(t0+dur+.1); }); }

  /* ---- ambience beds ---- */
  function makeBeds(){
    if(amb.ready) return; amb.ready=true;
    const loop=(buf)=>{ const s=c.createBufferSource(); s.buffer=buf; s.loop=true; return s; };
    // wind
    { const s=loop(noiseBuf(6,"pink")), f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=380; f.Q.value=.7; const g=c.createGain(); g.gain.value=0;
      const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=.07; lg.gain.value=260; lfo.connect(lg).connect(f.frequency);
      s.connect(f).connect(g); out(g,.4,true); s.start(); lfo.start(); amb.wind=g; }
    // night drone
    { const g=c.createGain(); g.gain.value=0; const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=260; f.Q.value=2;
      const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=.05; lg.gain.value=120; lfo.connect(lg).connect(f.frequency); lfo.start();
      for(const fr of [55,55.4,82.4,110.3,130.8]){ const o=c.createOscillator(); o.type="sawtooth"; o.frequency.value=fr; o.connect(f); o.start(); }
      f.connect(g); out(g,.7,true); amb.drone=g; }
    // fire crackle bed
    { const s=loop(noiseBuf(4,"brown")), f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=500; const g=c.createGain(); g.gain.value=0; s.connect(f).connect(g); out(g,.2,true); s.start(); amb.fire=g; }
    // day birds handled by events
    evTimer=setInterval(events,350);
  }
  function events(){
    if(!c||!curMood||!ambOn()) return; const T=c.currentTime+.02; const m=curMood; AMB=true;
    try{
      if(Math.random()<.05) noiseHit(T,{f:1800+Math.random()*2500,q:4,v:.025+Math.random()*.03,dur:.02+Math.random()*.03,wet:.1});
      if(m==="day"&&Math.random()<.012){ const b=2400+Math.random()*1500; for(let i=0;i<2+Math.floor(Math.random()*3);i++){ const o=c.createOscillator(), g=c.createGain(); o.type="sine"; const t0=T+i*.11; o.frequency.setValueAtTime(b,t0); o.frequency.exponentialRampToValueAtTime(b*(1.2+Math.random()*.4),t0+.07); o.connect(g); env(g,t0,.005,.018,.09); out(g,.35,true); o.start(t0); o.stop(t0+.12); } }
      if((m==="night"||m==="wolves")&&Math.random()<.0035) howl(T,{base:240+Math.random()*120,v:.035,dur:3+Math.random()*1.5,wet:.95});
      if(m==="night"&&Math.random()<.005){ for(const [dt,f] of [[0,390],[.45,330],[.62,330]]){ const o=c.createOscillator(), g=c.createGain(); o.type="sine"; o.frequency.setValueAtTime(f,T+dt); o.frequency.exponentialRampToValueAtTime(f*.92,T+dt+.25); o.connect(g); env(g,T+dt,.04,.025,.32); out(g,.8,true); o.start(T+dt); o.stop(T+dt+.4); } }
    } finally { AMB=false; }
  }
  function setMood(m){
    const C=ctx(); if(!C||!started) { curMood=m; return; } makeBeds(); curMood=m;
    const T=C.currentTime, ramp=(g,v)=>{ g.gain.cancelScheduledValues(T); g.gain.setValueAtTime(g.gain.value,T); g.gain.linearRampToValueAtTime(v,T+2.5); };
    const L={day:[.035,0,.04],dusk:[.035,.012,.05],night:[.06,.035,.045],wolves:[.08,.06,.03]}[m]||[.03,0,.04];
    ramp(amb.wind,L[0]); ramp(amb.drone,L[1]); ramp(amb.fire,L[2]);
    clearInterval(hbTimer); hbTimer=null;

  }
  function unlock(){ const C=ctx(); if(!C) return; if(C.state==="suspended") C.resume(); if(!started){ started=true; if(curMood) setMood(curMood); } }

  function setVolume(){ if(master) master.gain.value=vol(); if(ambBus){ const on=ambOn()?1:0; ambBus.gain.value=on; ambVerb.gain.value=on; } }

    const C=ctx(); if(!C||vol()<=0) return; if(C.state==="suspended") return; const T=C.currentTime+.01;
    switch(kind){
      case "tick": { const tock=(Math.round(T*2)%2)===0; noiseHit(T,{f:tock?1900:2600,q:8,v:.1,dur:.03,wet:.12}); break; }
      case "warn": bell(T,659,{dur:1.6,v:.16,ratio:2.01,idx:2.2}); bell(T+.22,523,{dur:2,v:.13,ratio:2.01,idx:2}); break;
      case "step": [659.3,987.8].forEach((f,i)=>bell(T+i*.12,f,{dur:1.2,v:.035,ratio:3.5,idx:1,wet:.75})); break;
      case "night": howl(T,{base:300,v:.2,dur:3.6}); chord(T+.2,[55,82.4,110,130.8],{type:"sawtooth",v:.05,dur:4,cut:600,wet:.8}); bell(T,65.4,{dur:4.5,v:.25,ratio:1.41,idx:2,wet:.8}); break;
      case "day": [0,1,2].forEach(i=>bell(T+i*.9,196,{dur:3.5,v:.22,ratio:2.76,idx:2.5,wet:.75})); [392,494,587.3,784].forEach((f,i)=>pluck(T+.2+i*.12,f,{v:.08,dur:.9,wet:.5})); break;
      case "vote": noiseHit(T,{f:700,q:3,v:.12,dur:.05,wet:.2}); break;
      case "flip": { const s=c.createBufferSource(); s.buffer=noiseBuf(.6); const f=c.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.2; f.frequency.setValueAtTime(400,T); f.frequency.exponentialRampToValueAtTime(5000,T+.4); const g=c.createGain(); s.connect(f).connect(g); env(g,T,.12,.25,.35); out(g,.4); s.start(T); s.stop(T+.6);
        [784,988,1175,1568,1976].forEach((fr,i)=>bell(T+.35+i*.07,fr,{dur:1.2,v:.06,ratio:3,idx:1,wet:.7})); break; }
      case "start": chord(T,[196,293.7],{type:"sawtooth",v:.07,dur:.7,cut:1600,wet:.5}); chord(T+.55,[220,329.6],{type:"sawtooth",v:.07,dur:.7,cut:1700,wet:.5}); chord(T+1.1,[261.6,392,523.3],{type:"sawtooth",v:.08,dur:1.6,cut:2200,wet:.6}); break;
      case "win": [[261.6,329.6,392],[293.7,370,440],[329.6,415.3,493.9],[392,493.9,587.3,784]].forEach((ch,i)=>chord(T+i*.32,ch,{type:"sawtooth",v:.06,dur:i===3?2.2:.5,cut:2600,wet:.55})); break;

      case "thunder": thunder(T); break;
      case "howl": howl(T); break;

/* ===================== 3D VILLAGE (custom WebGL renderer, no dependency) ===================== */
const V3 = (function(){

    if(src===L) return {same:1}; return {x:out,src};
  }catch(e){
    const src=L==="ru"?(/[a-z]/i.test(x)&&!/[éèàçù]/i.test(x)?"en":"fr"):/[а-яё]/i.test(x)?"ru":L==="fr"?"en":"fr";
    const r=await fetch("https://api.mymemory.translated.net/get?langpair="+src+"|"+L+"&q="+encodeURIComponent(x));
    const j=await r.json(); const out=j&&j.responseData&&j.responseData.translatedText;
    if(!out) throw 0; if(out.trim().toLowerCase()===x.trim().toLowerCase()) return {same:1};
    return {x:out,src};
  }
}

/* ---------- OpenAI translation (host only, key stays on this computer) ---------- */
const BUILTIN_OA="__HURLUNE_OA__";
function builtinKey(){ try{ if(BUILTIN_OA.startsWith("__")) return ""; return atob(BUILTIN_OA).split("").reverse().join(""); }catch(e){ return ""; } }
function oaKey(){ return (lsGet("oaKey")||"").trim()||builtinKey(); }
function oaModel(){ return (lsGet("oaModel")||"gpt-5.6-luna").trim(); }
async function openaiTranslate(x,langs){
  const key=oaKey(); if(!key||!langs.length) return null;
  const names={fr:"French",ru:"Russian",en:"English"};
  const body=m=>({model:m,response_format:{type:"json_object"},messages:[
    {role:"system",content:"You translate chat messages of an online Werewolf (Loup-Garou / Оборотни) party game played by French and Russian friends. Keep the casual tone, slang, jokes, emojis, @mentions and player names. Return ONLY a JSON object whose keys are the requested language codes and whose values are the translation of the message into that language (if the message is already in that language, return it unchanged)."},
    {role:"user",content:JSON.stringify({languages:langs.map(l=>l+" ("+names[l]+")"),message:x})}]});
  const call=async m=>{ const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify(body(m))});
    if(!r.ok){ const e=new Error("openai "+r.status); e.status=r.status; e.txt=await r.text().catch(()=>""); throw e; } const j=await r.json(); return JSON.parse(j.choices[0].message.content); };
  let out;
  try{ out=await call(oaModel()); }
  catch(e){ if(e.status===404||e.status===400){ out=await call("gpt-4.1-nano"); } else { APP.oaErr=e.status||"net"; throw e; } }
  APP.oaErr=null;
  const res={}; for(const l of langs) if(typeof out[l]==="string") res[l]=out[l];
  return res;
}
function hostTranslator(){ return oaKey()?openaiTranslate:null; }

function bindCreate(m){
  const c=m.cfg; const min=m.edit&&APP.st?Math.max(3,APP.st.players.length):3;
  const re=()=>{ c.name=$("#cName").value; renderModal(); };
  document.querySelectorAll("[data-cr]").forEach(b=>b.onclick=()=>{ const r=b.dataset.cr; const n=Math.max(0,Math.min(ROLES[r].max,(c.comp[r]||0)+(+b.dataset.d))); if(n) c.comp[r]=n; else delete c.comp[r]; re(); });
  document.querySelectorAll("[data-seat]").forEach(b=>b.onclick=()=>{ c.seats=Math.max(min,Math.min(16,c.seats+(+b.dataset.seat))); re(); });
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ c.mode=b.dataset.mode; re(); });
  document.querySelectorAll("[data-speed]").forEach(b=>b.onclick=()=>{ c.speed=b.dataset.speed; re(); });
  $("#sugg").onclick=()=>{ c.comp=suggestComp(c.seats); re(); };
  $("#mCancel").onclick=()=>{ APP.ui.modal=null; render(); };
  $("#mOk").onclick=async()=>{ c.name=$("#cName").value.trim()||t("defaultGameName",{n:APP.me.name});
    APP.ui.modal=null;
    if(m.edit){ send({t:"cfg",cfg:c}); render(); }
    else { render(); await createGame(clone(c)); } };
}

  const st=S(), v=V();
  const night = st.status==="running"&&isNight();
  const mood= st.status==="running" ? (st.ph.k==="n_wolves"?"wolves":night?"night":"day") : "dusk";
  if(APP.has3d) V3.setMood(mood); AUD.setMood(mood); $("#stage").classList.toggle("wolfturn",mood==="wolves");
  $("#stage").classList.toggle("lobbying",st.status==="lobby"||st.status==="starting"||st.status==="ended");
  const scene=$("#scene"); scene.classList.toggle("night",!(st.status==="running"&&!night)); scene.classList.toggle("day",st.status==="running"&&!night);
  $("#stage").classList.toggle("is-night",night);
  $("#roomName").textContent=st.name||"";
  const ns=APP.ui.netStatus; $("#net").innerHTML=ns==="online"?"":`<span class="netbad">⚠︎ ${esc(t("net_"+ns))}</span>`;
  $("#phLabel").textContent=phaseLabel();

function updTimer(){
  const el=$("#phTime"); if(!el) return; const s=timeLeft(); const st=S();
  const ring=$("#ring"), ic=$("#clockIc");
  if(ic) ic.textContent= st.status==="running"?(isNight()?"🌙":st.ph.k==="prompt"?"⚰️":"☀️"):st.status==="ended"?"🏁":"⏳";
  if(s==null||st.status==="lobby"||st.status==="ended"){ el.textContent=""; if(ring) ring.style.strokeDashoffset=0; return; }
  const key=st.ph.seq;
  if(APP._tk!==key){ APP._tk=key; APP._tkTotal=Math.max(s,1); APP._tkLast=s; }
  if(s<=10&&APP._tkLast>10) sfx("warn");
  else if(s<=5&&s>0&&s!==APP._tkLast) sfx("tick");
  APP._tkLast=s;
  if(ring){ const C=2*Math.PI*15; ring.style.strokeDasharray=C; ring.style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,s/APP._tkTotal))); ring.classList.toggle("hurry",s<=10); }
  const ph=document.querySelector(".phase"); if(ph) ph.classList.toggle("hurry",s<=10);
  el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); el.classList.toggle("hurry",s<=10);
  const bar=$("#mbar"); if(bar&&APP._mbarTotal){ bar.style.width=Math.max(0,Math.min(100,100*s/APP._mbarTotal))+"%"; }
}
setInterval(updTimer,500);

function layoutPositions(n){
  // rows staggered like a village square
  const rows = n<=6?[n]:n<=11?[Math.ceil(n/2),Math.floor(n/2)]:[Math.ceil(n/3),Math.ceil((n-Math.ceil(n/3))/2),n-Math.ceil(n/3)-Math.ceil((n-Math.ceil(n/3))/2)];
  const pos=[]; const R=rows.length;
  rows.forEach((cnt,ri)=>{ const y= R===1?64: R===2?(ri===0?56:76):(ri===0?50:ri===1?66:82);
    for(let i=0;i<cnt;i++){ const x= cnt===1?50: 10+ (80*(i+ (ri%2?0.5:0)))/(cnt-(ri%2?0:1)||1); pos.push({x:Math.min(92,x),y,z:ri}); } });
  return pos;
}
function targetable(id){
  const st=S(), v=V(), me=APP.me.pid, p=pl(id); if(!p) return false;
  const pr=v.prompt;
  if(pr&&(!pr.acted||pr.k==="wolves")&&pr.k!=="cand"&&pr.k!=="dictAsk"&&pr.k!=="witch") return promptValid(pr,id);
  if(pr&&pr.k==="witch"&&APP.ui.poisonMode) return p.alive&&id!==me;
  if(st.status!=="running"||!v.alive) return false;
  if(st.ph.k==="d_vote") return p.alive&&id!==me;
  if(st.ph.k==="d_elect") return p.alive&&(st.cands||[]).includes(id);
  return false;
}
function promptValid(pr,id){
  const p=pl(id), me=APP.me.pid, v=V(); if(!p) return false;
  if(pr.k==="grave") return id!==me;
  if(!p.alive) return false;
  if(pr.k==="tie") return pr.opts.includes(id);
  if(pr.k==="wolves") return !(v.wolves||[]).includes(id);
  if(pr.k==="guard") return id!==pr.not;
  if(pr.k==="pyro") return id!==me&&!(pr.barrels||[]).includes(id);
  if(pr.self) return true;
  return id!==me;
}

function bubbleFor(id){
  const b=APP.ui.bubbles&&APP.ui.bubbles[id]; if(!b||b.until<Date.now()) return "";
  let x=b.m.x; if(needTr(b.m)){ const r=trGet(b.m); if(r&&r.x) x=r.x; }
  if(x.length>70) x=x.slice(0,68)+"…";
  return `<div class="bubble">${esc(x)}</div>`;
}
function clickChar(id){
  const st=S(), v=V(), pr=v.prompt;
  if(pr&&pr.k==="witch"&&APP.ui.poisonMode){ APP.ui.witch={poison:id}; APP.ui.poisonMode=false; renderGame(); return; }
  if(pr&&(!pr.acted||pr.k==="wolves")&&pr.k!=="cand"&&pr.k!=="dictAsk"&&pr.k!=="witch"){ promptPick(pr,id); return; }
  if(st.ph.k==="d_vote"){
    const myVote=(st.votes||{})[APP.me.pid];
    if(myVote===id){ send({t:"act",seq:st.ph.seq,d:{t:null}}); return; }
    const others=Object.entries(st.votes||{}).filter(([a,b])=>b===id&&a!==APP.me.pid).length;
    if(!others){ APP.ui.modal={kind:"why",t:id}; render(); setTimeout(()=>{ const i=$("#whyIn"); if(i) i.focus(); },30); return; }
    send({t:"act",seq:st.ph.seq,d:{t:id}}); return;
  }
  if(st.ph.k==="d_elect"){ const myVote=(st.votes||{})[APP.me.pid]; send({t:"act",seq:st.ph.seq,d:{t:myVote===id?null:id}}); }
}
function promptPick(pr,id){
  const n=pr.n||1; let sel=APP.ui.sel;
  if(sel.includes(id)) sel=sel.filter(x=>x!==id); else sel=[...sel,id].slice(-n);
  APP.ui.sel=sel;
  if(pr.k==="wolves"){ send({t:"act",seq:pr.seq,d:{t:id,infect:!!APP.ui.infect}}); APP.ui.sel=[id]; renderGame(); return; }
  renderGame();
}
function confirmPrompt(){
  const pr=V().prompt; if(!pr) return; const sel=APP.ui.sel;
  let d=null;
  if(pr.k==="cupid"||pr.k==="rat"){ if(!sel.length||(pr.k==="cupid"&&sel.length!==2)) return; d={ts:sel}; }
  else if(sel.length) d={t:sel[0]};
  if(!d) return;
  send({t:"act",seq:pr.seq,d}); APP.ui.sel=[];
}

      h+=`<div class="chips">${opts.map(p=>`<button class="chip ${APP.ui.sel.includes(p.id)||(pr.k==="wolves"&&(v.wolfVotes||{})[me]===p.id)?"on":""}" data-pk="${esc(p.id)}">${headSVG(p.av)}<span>${esc(p.n)}${p.id===me?" ("+esc(t("you"))+")":""}</span>${pr.k==="wolves"&&countW(p.id)?`<em>🐺${countW(p.id)}</em>`:""}</button>`).join("")}</div>`;
      if(pr.k==="hunter") h+=`<div class="row c"><button class="btn-ghost" id="hNone">${esc(t("noOne"))}</button></div>`;
      if(pr.k!=="wolves") h+=`<div class="row c"><button class="btn-primary" id="pOk" ${APP.ui.sel.length===(pr.k==="cupid"?2:pr.k==="rat"?APP.ui.sel.length||99:1)&&APP.ui.sel.length?"":"disabled"}>${esc(t("confirm"))}</button></div>`;
    }
    h+=`<div class="mbar"><i id="mbar"></i></div></div>`;
  } else if(pr&&pr.k==="cand"){
    h=`<div class="card-c slim"><p>${esc(t("candInfo"))}</p><button class="btn-primary" id="candBtn">🎗️ ${esc(t("candBtn"))}</button></div>`;
  } else if(pr&&pr.acted&&pr.k!=="wolves"){
    h=`<div class="card-c slim done">✔ ${esc(t("actionDone"))}</div>`;
  } else if(st.status==="running"){
    const info=centerInfo(); if(info) h=`<div class="card-c slim">${info}</div>`;
  }
  el.innerHTML=h;
  const b=(id,fn)=>{ const x=$(id); if(x) x.onclick=fn; };
  b("#copyInv",()=>{ copyText(gameLink()); toast(t("linkCopied")); });
  b("#editG",()=>openCreate(true));
  b("#forceG",()=>send({t:"forceStart"}));
  el.querySelectorAll("[data-pk]").forEach(x=>x.onclick=()=>promptPick(pr,x.dataset.pk));
  b("#pOk",confirmPrompt);
  b("#hNone",()=>send({t:"act",seq:pr.seq,d:{none:true}}));
  b("#ignite",()=>send({t:"act",seq:pr.seq,d:{ignite:true}}));
  el.querySelectorAll("[data-dict]").forEach(x=>x.onclick=()=>send({t:"act",seq:pr.seq,d:{yes:x.dataset.dict==="1"}}));
  const inf=$("#infChk"); if(inf) inf.onchange=()=>{ APP.ui.infect=inf.checked; const mv=(V().wolfVotes||{})[me]; if(mv) send({t:"act",seq:pr.seq,d:{t:mv,infect:APP.ui.infect}}); };
  b("#wHeal",()=>{ const w=APP.ui.witch||{}; APP.ui.witch=w.heal?{}:{heal:true}; APP.ui.poisonMode=false; renderGame(); });
  b("#wPoison",()=>{ const w=APP.ui.witch||{}; if(w.poison){ APP.ui.witch={}; APP.ui.poisonMode=false; } else { APP.ui.witch={}; APP.ui.poisonMode=!APP.ui.poisonMode; } renderGame(); });
  b("#wSkip",()=>{ send({t:"act",seq:pr.seq,d:{skip:true}}); APP.ui.witch={}; APP.ui.poisonMode=false; });
  b("#wOk",()=>{ const w=APP.ui.witch||{}; send({t:"act",seq:pr.seq,d:w.heal?{heal:true}:{poison:w.poison}}); APP.ui.witch={}; APP.ui.poisonMode=false; });
  b("#candBtn",()=>{ APP.ui.modal={kind:"cand"}; render(); setTimeout(()=>{ const i=$("#whyIn"); if(i) i.focus(); },30); });
}
function countW(id){ const w=V().wolfVotes||{}; return Object.values(w).filter(x=>x===id).length; }
function centerInfo(){
  const st=S(), v=V(), k=st.ph.k;
  if(!v.alive&&k!=="prompt") return `💀 ${esc(t("youDead"))}`;
  if(k.startsWith("n_")) return `🌙 ${esc(t("sleeping"))}`;
  if(k==="d_vote") return `🗳️ ${esc(t("voteHelp"))}`;
  if(k==="d_elect") return `🗳️ ${esc(t("electHelp"))}`;
  if(k==="d_cand") return `🎗️ ${esc(t("candWait"))}`;
  if(k==="prompt") return `⏳ ${esc(t("waitPrompt",{n:pname(st.ph.who)}))}`;
  if(k==="d_dict") return `🎖️ ${esc(t("dictWait",{n:pname(st.ph.who)}))}`;
  if(k==="d_tie") return `⚖️ ${esc(t("tieWait"))}`;
  return "";
}
function renderComposer(){
  const i=$("#msgIn"); if(!i) return; const ch=chatChannel(), v=V(), st=S();
  const tb=$("#trBtn"); tb.classList.toggle("on",!!APP.set.tr);
  const lb=$("#loveBtn"); lb.hidden=!(v.chat&&v.chat.l); lb.classList.toggle("on",!!APP.ui.lovers);
  i.disabled=!ch; $("#sendBtn").disabled=!ch;
  let ph=t("typeMsg");
  if(!ch){ ph= st.status==="running"&&!v.alive?t("deadNoTalk"):isNight()?t("nightQuiet"):t("cantTalk"); }
  else if(ch==="w") ph=t("typeWolf"); else if(ch==="d") ph=v.alive?t("typeNecro"):t("typeDead"); else if(ch==="l") ph=t("typeLove");
  i.placeholder=ph; $("#composer").className="composer ch-"+(ch||"x");
}
let _lastChatLen=0;
function msgVisible(m){
  const st=S(), v=V();
  if(m.ch==="w"&&st.status==="running"&&v.chat&&!v.chat.seeW) return false;
  return true;
}
function renderChat(){
  const log=$("#chatlog"); if(!log||APP.view!=="game") return;
  const atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<80;
  const me=APP.me.pid, myn=norm(APP.me.name);
  let h=""; let lastA=null;
  for(const m of APP.msgs){
    if(!msgVisible(m)) continue;
    if(m.k&&!m.x&&(m.ch==="s"||m.ch==="ps")){
      lastA=null;
      const cls=m.cls||"info";
      h+=`<div class="sm-${cls} sysm ${m.ch==="ps"?"privm":""}">${fmt(m.k,m.p)}</div>`; continue;
    }
    let body=esc(m.x||"").replace(/@([^\s@]{1,18})/g,(a,n)=>`<b class="mn" data-n="${esc(n)}">@${n}</b>`);
    let trH="";
    if(m.x&&needTr(m)){ const r=trGet(m); if(!r&&!(S().oa&&Date.now()+APP.clockOff-(m.t||0)<15000)) trRequest(m);
      if(r&&r.x){ body=`<div class="trx">${esc(r.x)}</div><div class="ogx">${body}</div><button class="showog">${esc(t("original"))}</button>`; }
      else if(!r){ trH=`<div class="trwait">…</div>`; } }
    const mention=m.x&&myn&&m.a!==me&&norm(m.x).includes("@"+myn);
    const cls=["msg","ch-"+m.ch,m.cls?"mc-"+m.cls:"",m.a===me?"mine":"",mention?"mention":""].join(" ");
    const P=m.a&&!String(m.a).startsWith("anon:")?pl(m.a):null;
    const name=m.necro?"💀 "+t("r_necromancer"):(m.anon?"🐺 "+m.n:(P?P.n:m.n));
    const same=lastA===(m.a||m.n)+m.ch&&!m.cls;
    lastA=(m.a||m.n)+m.ch;
    const pre = m.cls==="accuse"?`<div class="acc">🗳️ ${fmt("accuse",m.p)}</div>`: m.cls==="pres"?`<div class="acc pres">🎗️ ${esc(t("m_presents"))}</div>`:"";
    h+=`<div class="${cls} ${same?"cont":""}">${same?"":`<div class="mav">${P?headSVG(P.av):m.anon?"🐺":m.necro?"💀":""}</div>`}<div class="mbody">${same?"":`<div class="mname"><b class="mn" data-n="${esc(P?P.n:m.n)}">${esc(name)}</b>${m.ch==="w"?` <span class="chtag w">${esc(t("wolves"))}</span>`:m.ch==="d"?` <span class="chtag d">${esc(t("graveyard"))}</span>`:m.ch==="l"?` <span class="chtag l">${esc(t("lovers"))}</span>`:""}</div>`}${pre}<div class="mtext">${body}</div>${trH}</div></div>`;
  }
  log.innerHTML=h;
  if(atBottom||APP.msgs.length!==_lastChatLen&&APP.msgs.length&&APP.msgs[APP.msgs.length-1].a===me) log.scrollTop=log.scrollHeight;
  _lastChatLen=APP.msgs.length;
}
function scrollChat(){ const log=$("#chatlog"); if(log) log.scrollTop=log.scrollHeight; }
function renderRules(){
  const el=$("#rules"), v=V(), st=S();
  let h="";
  if(v.role){
    const r=v.role;
    h+=`<div class="myrole"><div class="mr-card">${roleCardHTML(r,{small:1,camp:v.camp==="wolf"?"wolf":ROLES[r].camp})}</div><div><div class="muted sm">${esc(t("yourRole"))}</div><h3>${esc(roleName(r))}</h3><p>${esc(roleDesc(r))}</p><div class="goal">🎯 ${esc(t("goal_"+(v.camp==="wolf"?"wolf":r==="whiteWolf"?"white":r==="sickRat"?"rat":r==="mercenary"&&v.camp==="solo"?"merc":"village")))}</div></div></div>`;
    const info=[];
    if(v.infected) info.push("🦠 "+t("i_infected"));
    if(v.orig&&v.orig!==r) info.push("📜 "+t("i_orig",{r:roleName(v.orig)}));
    if(v.wolves&&v.wolves.length>1) info.push("🐾 "+t("i_pack",{n:v.wolves.filter(x=>x!==APP.me.pid).map(pname).join(", ")}));
    if(v.lover) info.push("💜 "+t("i_lover",{n:pname(v.lover),r:roleName(v.loverRole)}));
    if(v.couple) info.push("💘 "+t("i_couple",{a:pname(v.couple[0]),b:pname(v.couple[1])}));
    (v.seen||[]).forEach(s=>info.push(s.r?"🔮 "+t("i_seen",{n:pname(s.t),r:roleName(s.r)}):"✨ "+t("i_aura",{n:pname(s.t),a:t(s.aura==="dark"?"auraDarkS":"auraLightS")})));
    if(v.pot) info.push("🧪 "+t("i_pot",{h:v.pot.heal,p:v.pot.poison}));
    if(v.guardLast) info.push("🛡️ "+t("i_guard",{n:pname(v.guardLast)}));
    if(v.barrels&&v.barrels.length) info.push("🛢️ "+t("i_barrels",{n:v.barrels.map(pname).join(", ")}));
    if(v.testator) info.push("📜 "+t("i_testator",{n:pname(v.testator)}));
    if(v.merc) info.push("🗡️ "+t("i_merc",{n:pname(v.merc)}));
    if(v.word) info.push("🗣️ "+t("i_word",{w:v.word})+(v.saidWord?" ✔":""));
    if(v.letter) info.push("✒️ "+t("i_letter",{l:v.letter.toUpperCase()})+(v.usedLetter?" ✖":""));
    if(v.conta) info.push("🐀 "+t("i_conta",{n:v.conta.map(pname).join(", ")}));
    if(info.length) h+=`<div class="infos">${info.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`;
  } else h+=`<p class="muted">${esc(t("noRoleYet"))}</p>`;
  const rem=compRemaining();
  h+=`<h4>${esc(t(st.status==="running"?"remaining":"composition"))}</h4><div class="remgrid">${Object.entries(rem).filter(([r,c])=>c>0).map(([r,c])=>`<div class="rem c-${ROLES[r].camp}" title="${esc(roleDesc(r))}"><span class="re">${emb(r)}</span><b>${esc(roleName(r))}</b><em>×${c}</em></div>`).join("")}</div>`;
  const deadP=st.players.filter(p=>!p.alive&&p.role);
  if(deadP.length) h+=`<h4>${esc(t("deathJournal"))}</h4><div class="journal">${deadP.map(p=>`<div>💀 <b>${esc(p.n)}</b> — ${ROLES[p.role].icon} ${esc(roleName(p.role))}</div>`).join("")}</div>`;
  h+=`<h4>${esc(t("howTo"))}</h4><p class="muted sm">${esc(t("howToText"))}</p>`;
  el.innerHTML=h;
}
function renderReveal(){
  const el=$("#revealOv"), st=S(), v=V(); if(!el) return;
  if(st.status!=="running"||!v.role){ el.hidden=true; return; }
  const key=st.room+"|"+st.round+"|"+v.role+"|"+v.camp;
  const seen=lsGet("seenRev")||[];
  if(seen.includes(key)){ el.hidden=true; return; }
  if(el.dataset.key===key&&!el.hidden) return;
  el.dataset.key=key; el.hidden=false;
  const changed=seen.some(k=>k.startsWith(st.room+"|"+st.round+"|"));
  el.innerHTML=`<div class="rv-box"><div class="rv-title">${esc(t(changed?"rv_changed":"rv_title"))}</div>
    <div class="flip" id="flipCard"><div class="flip-in"><div class="face fback">${cardBackHTML()}</div><div class="face ffront">${roleCardHTML(v.role,{camp:v.camp==="wolf"?"wolf":ROLES[v.role].camp})}</div></div></div>
    <div class="rv-hint" id="rvHint">${esc(t("rv_click"))}</div>
    <div class="rv-extra" id="rvExtra" hidden>${v.infected?`<p>🦠 ${esc(t("i_infected"))}</p>`:""}${v.wolves&&v.wolves.length>1?`<p>🐾 ${esc(t("i_pack",{n:v.wolves.filter(x=>x!==APP.me.pid).map(pname).join(", ")}))}</p>`:""}<div class="goal">🎯 ${esc(t("goal_"+(v.camp==="wolf"?"wolf":v.role==="whiteWolf"?"white":v.role==="sickRat"?"rat":v.role==="mercenary"&&v.camp==="solo"?"merc":"village")))}</div>
    <button class="btn-primary" id="rvOk">${esc(t("rv_ok"))}</button></div></div>`;
  const fc=$("#flipCard");
  fc.onclick=()=>{ if(fc.classList.contains("flipped")) return; fc.classList.add("flipped"); sfx("flip"); $("#rvHint").hidden=true; setTimeout(()=>{ const x=$("#rvExtra"); if(x) x.hidden=false; },650); };
  $("#rvOk").onclick=()=>{ const s=lsGet("seenRev")||[]; s.push(key); lsSet("seenRev",s.slice(-40)); el.hidden=true; };
}
function renderEnd(){
  const el=$("#endov"), st=S();
  if(st.status!=="ended"||APP.ui.endClosed){ el.hidden=true; return; }
  el.hidden=false;
  const win=st.winners||[];
  const mine=win.includes(APP.me.pid);
  let conf=""; if(mine){ for(let i=0;i<60;i++) conf+=`<i style="left:${Math.random()*100}%;background:hsl(${Math.random()*360} 85% 65%);animation-delay:${(Math.random()*2.5).toFixed(2)}s;animation-duration:${(2.5+Math.random()*2).toFixed(2)}s"></i>`; }
  el.innerHTML=`<div class="confetti">${conf}</div><div class="endcard w-${esc(st.winner)}"><div class="end-res ${mine?"won":"lost"}">${esc(t(mine?"youWon":"youLost"))}</div><div class="endico">${{village:"🏡",wolf:"🐺",lovers:"💘",white:"🤍",rat:"🐀",merc:"🗡️",draw:"⚖️"}[st.winner]||"🏁"}</div><h2>${esc(t("win_"+st.winner))}</h2>
   <div class="winners">${win.map(id=>{ const p=pl(id); return p?`<div class="wch">${charSVG(p.av)}<b title="${esc(p.n)}">${esc(p.n)}</b></div>`:""; }).join("")}</div>
   <div class="reveal">${st.players.map(p=>`<div class="${win.includes(p.id)?"w":""} ${p.alive?"":"dead"}"><span class="re">${p.role?emb(p.role):""}</span><div class="rvt"><b title="${esc(p.n)}">${p.alive?"":"💀 "}${esc(p.n)}</b><span>${p.role?esc(roleName(p.role)):""}${p.inf?" 🦠":""}</span></div></div>`).join("")}</div>
   <div class="row c">${APP.host?`<button class="btn-primary" id="againBtn">↻ ${esc(t("playAgain"))}</button>`:`<span class="muted">${esc(t("waitAgain"))}</span>`}<button class="btn-ghost" id="closeEnd">${esc(t("seeChat"))}</button></div></div>`;
  const a=$("#againBtn"); if(a) a.onclick=()=>send({t:"again"});
  $("#closeEnd").onclick=()=>{ APP.ui.endClosed=true; renderEnd(); };
}

/* ---------- modals ---------- */
function renderModal(){
  let el=$("#modal"); const m=APP.ui.modal;
  if(!m){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="modal"; el.className="modal"; document.body.appendChild(el); el.onclick=e=>{ if(e.target===el&&APP.ui.modal&&APP.ui.modal.kind!=="create"){ APP.ui.modal=null; render(); } }; }
  if(m.kind==="create"){ el.innerHTML=createModal(m); bindCreate(m); return; }
  if(m.kind==="settings"){
    const sw=(id,on,ic,title,desc)=>`<label class="opt"><span class="opt-ic">${ic}</span><span class="opt-t"><b>${esc(title)}</b><small>${esc(desc)}</small></span><span class="switch"><input type="checkbox" id="${id}" ${on?"checked":""}><i></i></span></label>`;
    const th=APP.set.theme||"village";
    const themes=[["village","🔥",t("th_village"),t("th_village_d")],["forest","🌲",t("th_forest"),t("th_forest_d")],["winter","❄️",t("th_winter"),t("th_winter_d")],["classic","🖼️",t("th_classic"),t("th_classic_d")]];
    el.innerHTML=`<div class="mcard settings"><h2>⚙︎ ${esc(t("settings"))}</h2>
      <div class="frm"><label>${esc(t("language"))}</label><div class="seg"><button data-l="fr" class="${LANG==="fr"?"on":""}">Français</button><button data-l="ru" class="${LANG==="ru"?"on":""}">Русский</button><button data-l="en" class="${LANG==="en"?"on":""}">English</button></div></div>
      <div class="frm"><label>${esc(t("decor"))}</label><div class="themes">${themes.map(([k,ic,n,d])=>`<button class="theme ${th===k?"on":""}" data-th="${k}"><span class="th-ic">${ic}</span><b>${esc(n)}</b><small>${esc(d)}</small></button>`).join("")}</div><p class="muted sm">${esc(t("decorHelp"))}</p></div>
      <div class="frm"><label>${esc(t("chatOpts"))}</label>${sw("sTr",APP.set.tr,"🌐",t("optTr"),t("optTrD"))}</div>
      <div class="frm"><label>${esc(t("soundOpts"))}</label>
        ${sw("sFx",APP.set.sfx!==false,"🔔",t("optFx"),t("optFxD"))}
        ${sw("sAmb",APP.set.amb!==false,"🌙",t("optAmb"),t("optAmbD"))}
        <div class="opt vol"><span class="opt-ic">🔊</span><span class="opt-t"><b>${esc(t("volume"))}</b></span><input type="range" id="sVol" min="0" max="1" step="0.05" value="${APP.set.vol!=null?APP.set.vol:.7}"></div></div>
      <div class="mfoot"><button class="btn-primary" id="sOk">OK</button></div></div>`;
    el.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ setLang(b.dataset.l); });
    el.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{ APP.set.theme=b.dataset.th; saveSettings(); applyTheme(); renderModal(); });
    $("#sTr").onchange=e=>{ APP.set.tr=e.target.checked; saveSettings(); if(APP.view==="game"){ renderComposer(); renderChat(); } };
    $("#sFx").onchange=e=>{ APP.set.sfx=e.target.checked; saveSettings(); if(e.target.checked) AUD.play("ping"); };
    $("#sAmb").onchange=e=>{ APP.set.amb=e.target.checked; saveSettings(); AUD.setVolume(); };
    $("#sVol").oninput=e=>{ APP.set.vol=+e.target.value; saveSettings(); AUD.setVolume(); };
    $("#sVol").onchange=()=>AUD.play("ping");
    $("#sOk").onclick=()=>{ APP.ui.modal=null; render(); };
    return;
  }
  if(m.kind==="why"||m.kind==="cand"){
    const isWhy=m.kind==="why";
    el.innerHTML=`<div class="mcard"><h2>${esc(isWhy?t("whyTitle",{n:pname(m.t)}):t("candTitle"))}</h2><p class="muted">${esc(isWhy?t("whyHelp"):t("candHelp"))}</p>
     <form id="whyF"><input id="whyIn" maxlength="${isWhy?200:300}" placeholder="${esc(isWhy?t("whyPh"):t("candPh"))}" autocomplete="off"><div class="mfoot"><button type="button" class="btn-ghost" id="whyC">${esc(t("cancel"))}</button><button class="btn-primary">${esc(isWhy?t("accuseBtn"):t("candBtn"))}</button></div></form></div>`;
    $("#whyC").onclick=()=>{ APP.ui.modal=null; render(); };
    $("#whyF").onsubmit=e=>{ e.preventDefault(); const x=$("#whyIn").value.trim(); if(x.length<2){ $("#whyIn").focus(); return; }
      const st=S(); if(isWhy) send({t:"act",seq:st.ph.seq,d:{t:m.t,why:x}}); else send({t:"act",seq:V().prompt.seq,d:{x}});
      APP.ui.modal=null; render(); };
  }
}
function renderToast(){ let el=$("#toast"); if(!APP.ui.toast){ if(el) el.remove(); return; } if(!el){ el=document.createElement("div"); el.id="toast"; document.body.appendChild(el); } el.textContent=APP.ui.toast; }

/* ---------- boot ---------- */
(async function boot(){
  await ensureMe();
  const g=parseHash();
  if(g&&APP.me.name){ const saved=lsGet("host."+g.room); APP.view="game"; render(); joinGame(g); }
  else render();
  window.addEventListener("hashchange",()=>{ const g2=parseHash(); if(g2&&APP.view==="hub"&&APP.me.name) joinGame(g2); });
})();

</script>
