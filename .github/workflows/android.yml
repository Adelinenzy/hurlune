name: Appli Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Copier le jeu dans l'appli
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          A=android/app/src/main/assets
          mkdir -p $A tools/libs
          cp index.html $A/index.html && cp -r chars $A/
          npm install --prefix tools/libs mqtt@5.10.1 --no-save --no-audit --no-fund
          node tools/inline-libs.js $A/index.html
          node tools/inject-key.js $A/index.html
      - name: Clé de signature (si configurée)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/hurlune.jks; echo "KEYSTORE_FILE=$RUNNER_TEMP/hurlune.jks" >> $GITHUB_ENV; fi
      - name: Construire l'APK
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          HURLUNE_PROXY_USER: ${{ secrets.HURLUNE_PROXY_USER }}
          HURLUNE_PROXY_PASS: ${{ secrets.HURLUNE_PROXY_PASS }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Hurlune.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hurlune-android
          path: Hurlune.apk
