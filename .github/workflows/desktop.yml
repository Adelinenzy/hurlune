name: Applis de bureau

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copier le jeu dans l'appli
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p desktop/app tools/libs
          cp index.html desktop/app/index.html && cp -r chars desktop/app/
          npm install --prefix tools/libs mqtt@5.10.1 --no-save --no-audit --no-fund
          node tools/inline-libs.js desktop/app/index.html
          node tools/inject-key.js desktop/app/index.html
      - name: Proxy intégré (identifiants depuis les secrets)
        shell: bash
        env:
          PU: ${{ secrets.HURLUNE_PROXY_USER }}
          PP: ${{ secrets.HURLUNE_PROXY_PASS }}
        run: |
          if [ -n "$PU" ]; then node -e 'require("fs").writeFileSync("desktop/proxy.json",JSON.stringify({user:process.env.PU,password:process.env.PP}))'; echo "proxy intégré"; else echo "pas de proxy (secrets absents)"; fi
      - name: Construire
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: hurlune-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
          name: Hurlune ${{ github.ref_name }}
          body: |
            Téléchargez l'appli pour votre ordinateur :
            - **Windows** : `Hurlune-…-win-x64.exe` (installateur) ou la version *portable*
            - **Mac** : `.dmg` (au premier lancement : clic droit → Ouvrir)
            - **Linux** : `.AppImage`

            Скачайте приложение для своего компьютера (Windows `.exe`, Mac `.dmg`, Linux `.AppImage`).
